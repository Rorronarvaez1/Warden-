name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Versión fija: "latest" consulta la API de GitHub sin token y falla por rate limit.
          version: 2.107.0
      # Aplica migraciones + seed en un Postgres limpio para detectar SQL inválido.
      - run: supabase db start
